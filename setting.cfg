### RayelleBX Setting Config
#
# '#'로 시작하는 줄은 주석으로 처리됩니다.
# 변경 후 게임을 재시작해야 반영됩니다.

## Plugin On/Off Setting
# 사용할 기능 -> true
# 미사용 기능 -> false
OverwhelmIndicator = true

# 퀵메뉴에 대화 자동 스킵 매크로 버튼 추가 (Q키로 중단)
QuickMenuMacro = true

# 회복 탭에 자동 먹이기 매크로 버튼 추가 (Q키로 중단)
CharRecoveryMacro = true

# 코스튬 탭 열 때마다 코스튬 ID/이름을 CSV에 기록
CharCostumeLogging = true
