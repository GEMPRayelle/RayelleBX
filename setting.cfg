### RayelleBX Setting Config
#
# '#'로 시작하는 줄은 주석으로 처리됩니다.
# 변경 후 게임을 재시작해야 반영됩니다.

## Plugin On/Off Setting
# 사용할 기능 -> true
# 미사용 기능 -> false
OverwhelmIndicator = true

# 퀵메뉴에 대화 자동 스킵 매크로 버튼 추가 (Q키로 중단)
QuickMenuMacro = true

# 회복 탭에 자동 먹이기 매크로 버튼 추가 (Q키로 중단)
CharRecoveryMacro = true

# 코스튬 탭 열 때마다 코스튬 ID/이름을 CSV에 기록
CharCostumeLogging = true

# 가챠 화면에 무한뽑기 매크로 버튼 추가 (Q키로 중단)
InfiniteGachaMacro = true


### 무한뽑기 매크로 셋팅

## Button Delay Setting
# StepDelay : 각 버튼 눌린 후 딜레이 (초)
# WaitResultTimeout : 결과 화면 나온 뒤 대기 시간 (초)
StepDelay = 0.2
WaitResultTimeout = 1.0

## Gacha Result Condition
# MinUR : 10연차 결과에서 최소 UR 개수
# EssentialUR : 그 중 WishCostume 목록에 있어야 하는 최소 개수
MinUR = 2
EssentialUR = 1
# 기본 셋팅 -> 최소 UR 2개 이상, 그 중 최소 1개는 WishCostume 포함
# 위시 코스튬 불필요 시 EssentialUR = 0
# 매크로는 Q 누르면 종료


## WishCostume 리스트
# Resources 폴더 내의 CostumeMapping.csv에서 원하는 코스튬 ID를 확인하여 기재
# 형식: CostumeID,CharacterName_CostumeName  (한 줄에 하나씩)
WishCostume =
